openapi: 3.1.0
info:
  title: SynapseOS API
  version: 1.0.0
  description: Enterprise Swarm Intelligence Platform MVP Contract
paths:
  /api/dashboard:
    get:
      summary: Get manager dashboard metrics and tables
      responses:
        '200':
          description: Dashboard data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
  /api/observations:
    post:
      summary: Submit a new organizational observation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
                - submitted_by
              properties:
                text:
                  type: string
                  minLength: 10
                  example: "Customer onboarding is causing churn and support tickets are increasing."
                submitted_by:
                  type: string
                  example: "Jane Smith"
      responses:
        '201':
          description: Observation captured and processing started
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - status
                  - created_at
                properties:
                  id:
                    type: string
                    format: uuid
                    example: "dc7b2b8e-1234-5678-abcd-ef1234567890"
                  status:
                    type: string
                    example: "processing"
                  created_at:
                    type: string
                    format: date-time
                    example: "2026-06-07T12:17:00Z"
  /api/observations/{id}/analysis:
    get:
      summary: Get agent analysis trace and discovered items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Analysis data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResponse'
  /api/observations/{id}/implement:
    post:
      summary: Execute an action plan for a chosen solution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chosen_solution_id
              properties:
                chosen_solution_id:
                  type: string
                  format: uuid
                  example: "a1b2c3d4-5678-90ab-cdef-1234567890ab"
      responses:
        '200':
          description: Action plan generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImplementResponse'
components:
  schemas:
    DashboardResponse:
      type: object
      required:
        - savings_opportunities
        - emerging_issues
        - duplicate_projects
      properties:
        savings_opportunities:
          type: object
          required:
            - total_issues_deflected
            - total_hours_saved
            - total_cost_saved_usd
          properties:
            total_issues_deflected:
              type: integer
              example: 14
            total_hours_saved:
              type: integer
              example: 340
            total_cost_saved_usd:
              type: integer
              example: 51000
        emerging_issues:
          type: array
          items:
            type: object
            required: [id, title, reports_count, trend]
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              reports_count:
                type: integer
              trend:
                type: string
                enum: [rising, stable, resolved]
        duplicate_projects:
          type: array
          items:
            type: object
            required: [id, title, duplicates_found, hours_wasted]
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              duplicates_found:
                type: integer
              hours_wasted:
                type: integer
    AnalysisResponse:
      type: object
      required:
        - observation_id
        - overall_confidence_score
        - agent_trace
        - similar_issues
        - previous_solutions
      properties:
        observation_id:
          type: string
          format: uuid
        overall_confidence_score:
          type: number
          example: 0.87
        agent_trace:
          type: array
          items:
            $ref: '#/components/schemas/AgentTrace'
        similar_issues:
          type: array
          items:
            type: object
            required: [id, title, department, confidence]
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              department:
                type: string
              confidence:
                type: number
        previous_solutions:
          type: array
          items:
            type: object
            required: [id, title, owner, reuse_confidence]
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              owner:
                type: string
              reuse_confidence:
                type: number
    AgentTrace:
      type: object
      required:
        - agent_name
        - status
        - output_summary
      properties:
        agent_name:
          type: string
          enum: [Orchestrator, Memory, DuplicateDetection, SolutionDiscovery, Action]
        status:
          type: string
          enum: [pending, running, complete, error]
        output_summary:
          type: string
    ImplementResponse:
      type: object
      required:
        - implementation_plan
        - actions
        - stakeholders
      properties:
        implementation_plan:
          type: string
        actions:
          type: array
          items:
            type: object
            required: [step, task, due_days]
            properties:
              step:
                type: integer
              task:
                type: string
              due_days:
                type: integer
        stakeholders:
          type: array
          items:
            type: string
